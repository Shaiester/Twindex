name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests never load the embedding model (imported lazily), so CI skips torch/sentence-transformers.
      - run: pip install faiss-cpu==1.15.1 numpy pytest
      - run: python -m pytest -q
